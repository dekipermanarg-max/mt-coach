name: Sync Branch Targets

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply official branch target configuration
        run: |
          python - <<'PY'
          from pathlib import Path

          # Dashboard: official LD target for S. Parman is 3 (6 eligible rombels).
          p = Path('app/page.tsx')
          s = p.read_text()
          s = s.replace('"S. Parman": 1,', '"S. Parman": 3,')
          s = s.replace('"S. Parman": 1,\n  "Gajah Mada": 10,', '"S. Parman": 6,\n  "Gajah Mada": 10,')
          p.write_text(s)

          # Performance: master branch names include city prefixes. Normalize them
          # against the official short branch keys so targets follow the dropdown.
          p = Path('app/performance/page.tsx')
          s = p.read_text()
          s = s.replace('"Ujung Gurun": 2, "Tarandam": 6, "Sutomo": 11, "S. Parman": 1, "Gajah Mada": 10,',
                        '"Ujung Gurun": 2, "Tarandam": 6, "Sutomo": 11, "S. Parman": 6, "Gajah Mada": 10,')
          marker = 'function weeksInRange(start: string, end: string) {'
          helper = '''function getBranchTargetKey(name: string) {\n  const normalized = name.toLowerCase().replace(/[–—]/g, "-").replace(/\\s+/g, " ").trim();\n  return Object.keys(LD_ELIGIBLE_ROMBEL).find(key => {\n    const target = key.toLowerCase();\n    return normalized === target || normalized.endsWith(` - ${target}`);\n  }) || null;\n}\n'''
          if 'function getBranchTargetKey' not in s:
              s = s.replace(marker, helper + marker)
          s = s.replace('const selectedBranchCount = branch === "Semua Cabang" ? branches.filter(b => LD_ELIGIBLE_ROMBEL[b.name] !== undefined).length : 1;',
                        'const selectedBranchCount = branch === "Semua Cabang" ? branches.filter(b => getBranchTargetKey(b.name)).length : 1;')
          s = s.replace('const ldEligible = branch === "Semua Cabang" ? Object.values(LD_ELIGIBLE_ROMBEL).reduce((a, b) => a + b, 0) : (LD_ELIGIBLE_ROMBEL[branch] || 0);',
                        'const selectedBranchKey = branch === "Semua Cabang" ? null : getBranchTargetKey(branch);\n  const ldEligible = branch === "Semua Cabang" ? Object.values(LD_ELIGIBLE_ROMBEL).reduce((a, b) => a + b, 0) : (selectedBranchKey ? LD_ELIGIBLE_ROMBEL[selectedBranchKey] : 0);')
          p.write_text(s)
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx app/performance/page.tsx
          if git diff --cached --quiet; then
            echo "No branch target changes needed"
            exit 0
          fi
          git commit -m "Connect Dashboard and Performance to branch targets"
          git push
