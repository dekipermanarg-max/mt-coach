name: Apply Monitoring Input Order

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch monitoring order
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/monitoring/page.tsx')
          s = p.read_text()
          if 'created_at: string;' not in s:
              s = s.replace('id: string; planning_date: string;', 'id: string; created_at: string; planning_date: string;')
          old = 'select("id,planning_date,branch_id,mt_id,rombel_id,mapel_id,jenis_sesi,auvi_tv,ld,topik_sub_topik,topik_sub_topik_done,attendance,starchamps,activity_score,report_sessions,foto_kbm,report_wa,auvi_tv_status,ld_status")\n      .eq("status", "Finalized").order("planning_date", { ascending: false });'
          new = 'select("id,created_at,planning_date,branch_id,mt_id,rombel_id,mapel_id,jenis_sesi,auvi_tv,ld,topik_sub_topik,topik_sub_topik_done,attendance,starchamps,activity_score,report_sessions,foto_kbm,report_wa,auvi_tv_status,ld_status")\n      .eq("status", "Finalized").order("created_at", { ascending: true });'
          if old not in s:
              raise SystemExit('Expected Monitoring query not found; aborting')
          s = s.replace(old, new)
          p.write_text(s)
          PY

      - name: Commit production change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/monitoring/page.tsx
          git diff --cached --quiet || git commit -m 'fix: preserve weekly planning input order in monitoring'
          rm .github/workflows/apply-monitoring-order.yml
          git add .github/workflows/apply-monitoring-order.yml
          git commit -m 'chore: remove temporary deployment workflow'
          git push