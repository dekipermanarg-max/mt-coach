name: Fix Branch Target Config

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Correct S. Parman eligible rombels
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/page.tsx')
          s = p.read_text()
          marker = 'const LD_ELIGIBLE_ROMBELS: Record<string, number> = {'
          before, after = s.split(marker, 1)
          body, tail = after.split('};', 1)
          body = body.replace('"S. Parman": 3,', '"S. Parman": 6,')
          p.write_text(before + marker + body + '};' + tail)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Correct S. Parman eligible rombel target"
          git push
