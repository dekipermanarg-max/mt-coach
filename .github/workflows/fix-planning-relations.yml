name: Fix Weekly Planning relation aliases

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fix relation aliases
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/planning/page.tsx')
          s = p.read_text()
          old = 'master_mt(name),master_rombel(name),master_mapel(name)'
          new = 'mt:master_mt(name),rombel:master_rombel(name),mapel:master_mapel(name)'
          if old not in s:
              print('Relation aliases already fixed or pattern not found.')
              raise SystemExit(0)
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Revise WhatsApp admin report
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          p = Path('app/monitoring/page.tsx')
          s = p.read_text()
          start = s.find('  const waReport = useMemo(() => {')
          end = s.find('  async function copyWaReport()', start)
          if start == -1 or end == -1:
              print('WA report block not found; skipping.')
              raise SystemExit(0)
          replacement = base64.b64decode('').decode()
          p.write_text(s[:start] + replacement + s[end:])
          PY
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/planning/page.tsx app/monitoring/page.tsx
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
          else
            git commit -m 'Fix Weekly Planning master relation aliases'
            git push
          fi
