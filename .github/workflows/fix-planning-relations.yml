name: Fix Weekly Planning relation aliases

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fix relation aliases
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/planning/page.tsx')
          s = p.read_text()
          old = 'master_mt(name),master_rombel(name),master_mapel(name)'
          new = 'mt:master_mt(name),rombel:master_rombel(name),mapel:master_mapel(name)'
          if old in s: p.write_text(s.replace(old, new, 1))
          PY
      - name: Revise WhatsApp admin report
        run: |
          python -c 'from pathlib import Path; p=Path(\'app/monitoring/page.tsx\'); s=p.read_text(); s=s.replace(\'📋 *REPORT KELENGKAPAN ADMINISTRASI MT*\',\'📋 *REPORT ADMINISTRASI MT*\'); s=s.replace(\'`📅 Tanggal: ${formatDate(waDate)}`, `📊 ${reportCompleteCount} sesi lengkap · ${reportIncompleteCount} sesi belum lengkap`, ""\',\'`📅 ${formatDate(waDate)}`, `🏫 ${branchId === "all" ? "Semua Cabang" : nameOf(branches, branchId)}`, `📊 *${reportCompleteCount} lengkap · ${reportIncompleteCount} belum lengkap*`, ""\'); s=s.replace(\'lines.push("Mohon segera dilengkapi administrasinya ya. Berikut sesi yang masih belum lengkap:", "");\',\'lines.push("⚠️ *Mohon segera lengkapi administrasi sesi berikut:*", "");\'); s=s.replace(\'lines.push(`${number++}. ${formatDate(row.planning_date)} · ${nameOf(branches, row.branch_id)}`, `   ${nameOf(rombels, row.rombel_id)} · ${nameOf(mapels, row.mapel_id)} · ${row.jenis_sesi}`, `   ❌ Belum: ${missing.join(", ")}`);\',\'lines.push(`${number++}. ${nameOf(rombels, row.rombel_id)} · ${nameOf(mapels, row.mapel_id)} · ${row.jenis_sesi}`, `   ❌ ${missing.join(" · ")}`, "");\'); s=s.replace(\'lines.push("Terima kasih 🙏");\',\'lines.push("🙏 *Yuk, segera dilengkapi agar administrasi sesi tercatat lengkap.*");\'); p.write_text(s)'
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/planning/page.tsx app/monitoring/page.tsx
          if git diff --cached --quiet; then echo 'No changes to commit.'; else git commit -m 'Revise WhatsApp admin report format'; git push; fi
