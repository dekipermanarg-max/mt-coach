name: Apply Monitoring UI Patch
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: "!contains(github.event.head_commit.message, '[auto-patch]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Monitoring
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/monitoring/page.tsx')
          s = p.read_text()
          old_fn = '''  function clearDates() { if (!rows.length) return; const dates = rows.map(x => x.planning_date).sort(); setStartDate(dates[0]); setEndDate(dates[dates.length - 1]); }\n'''
          new_fn = '''  function clearDates() { if (!rows.length) return; const dates = rows.map(x => x.planning_date).sort(); setStartDate(dates[0]); setEndDate(dates[dates.length - 1]); }\n\n  async function completeAllCheckboxes(row: MonitoringRow) {\n    if (saving === row.id) return;\n    setSaving(row.id); setMessage("");\n    const patch = {\n      topik_sub_topik_done: true,\n      attendance: true,\n      starchamps: true,\n      activity_score: true,\n      report_sessions: true,\n      foto_kbm: true,\n      report_wa: true,\n    };\n    const { error } = await supabase.from("weekly_planning").update(patch as never).eq("id", row.id).eq("status", "Finalized");\n    if (error) setMessage(`Gagal melengkapi administrasi: ${error.message}`);\n    else setRows(prev => prev.map(x => x.id === row.id ? { ...x, ...patch } : x));\n    setSaving(null);\n  }\n'''
          if old_fn not in s:
              raise SystemExit('anchor function not found')
          if 'completeAllCheckboxes' not in s:
              s = s.replace(old_fn, new_fn, 1)
          old_title = '''<div className="monitoring-admin-title">KELENGKAPAN ADMINISTRASI <span>{done}/{total} selesai</span></div>'''
          new_title = '''<div className="monitoring-admin-title"><span>KELENGKAPAN ADMINISTRASI</span><div className="monitoring-admin-title-actions"><span>{done}/{total} selesai</span>{!complete && <button type="button" className="complete-all-btn" disabled={saving === row.id} onClick={() => completeAllCheckboxes(row)}>✓ Semua Lengkap</button>}</div></div>'''
          if old_title not in s:
              raise SystemExit('anchor title not found')
          s = s.replace(old_title, new_title, 1)
          css_anchor = '''.wa-report-btn{white-space:nowrap}'''
          css_add = '''.monitoring-admin-title-actions{display:flex;align-items:center;gap:8px}.complete-all-btn{border:1px solid #bbf7d0;background:#f0fdf4;color:#15803d;border-radius:8px;padding:5px 9px;font-size:10px;font-weight:800;cursor:pointer;white-space:nowrap}.complete-all-btn:hover{background:#dcfce7}.complete-all-btn:disabled{opacity:.55;cursor:not-allowed}'''
          if css_add not in s:
              s = s.replace(css_anchor, css_anchor + css_add, 1)
          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/monitoring/page.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Add Semua Lengkap button [auto-patch]"
          git push
      - name: Remove patch workflow
        if: success()
        run: |
          git rm .github/workflows/apply-monitoring-ui-patch.yml
          git commit -m "Remove temporary UI patch workflow [auto-patch]"
          git push
