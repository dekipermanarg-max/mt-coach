name: Reorder Mathchamps sections

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  reorder:
    if: ${{ !startsWith(github.event.head_commit.message, 'Reorder Mathchamps sections') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reorder sections
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/sessions/page.tsx')
          s = p.read_text()
          start_att = s.index('\n    <section className="attention-section">')
          start_rec = s.index('\n    <section className="recognition-section">', start_att)
          end_rec = s.index('\n\n    <div className="attention-two-col">', start_rec)
          rec_block = s[start_rec:end_rec]
          s = s[:start_att] + rec_block + '\n' + s[start_att:start_rec] + s[end_rec:]
          p.write_text(s)
          PY
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/sessions/page.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Reorder Mathchamps sections"
          git push
